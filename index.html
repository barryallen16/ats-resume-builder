<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume venuma?</title>
    <link href="https://fonts.googleapis.com/css2?family=Sedgwick+Ave+Display&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { background-color: #0f0f0f; }
        textarea, input { background-color: #1a1a1a !important; }
        .preview-container { background-color: #1a1a1a; }
        textarea:disabled, input:disabled { opacity: 0.7; cursor: not-allowed; }
        .locked-indicator { background-color: #22c55e; }
        .font-op {
            font-family: "Sedgwick Ave Display", cursive;
            font-weight: 400;
            font-style: normal;
        }
        .name-modal {
            background-color: rgba(0, 0, 0, 0.85);
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen p-6">
    <!-- Name Input Modal -->
    <div id="nameModal" class="name-modal fixed inset-0 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-lg border border-gray-700 text-center">
            <h2 class="text-xl font-bold mb-4 font-sans  uppercase ">Resume <span class="font-serif italic  decoration-lime-500 underline">venuma?</span></h2>
            <p class="text-gray-400 mb-4">What's your name?</p>
            <input type="text" id="nameInput" class="w-64 p-2 rounded border border-gray-700 text-gray-100 text-center mb-4" placeholder="Enter your name...">
            <br>
            <button id="saveNameBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded">Let's Go!</button>
        </div>
    </div>
    <div class="max-w-6xl mx-auto">
        <!-- Name Tag -->
        <div class="flex flex-col items-center mb-6">
            <div class="h-24 w-48 bg-white rounded-lg pt-8 relative -rotate-4 cursor-pointer" id="nameTagContainer" title="Click to change name">
                <div class="w-[95%] h-[90%] bg-yellow-400 left-0 right-0 absolute m-auto bottom-1 rounded-lg items-center">
                    <h1 class="flex justify-center items-center font-sans font-black uppercase">Hello</h1>
                </div>
                <label class="absolute left-0 right-0 m-auto bg-white h-[60%] w-[90%] bottom-2 rounded-b-lg">
                    <div class="uppercase text-red-600 font-op flex flex-col h-full justify-center items-center text-xl">
                        <h3 id="stdname">Your Name</h3>
                    </div>
                </label>
            </div>
            <h1 class="text-2xl font-medium mt-4 text-center font-sans  uppercase ">Resume <span class="font-serif italic  decoration-lime-500 underline">venuma?</span> </h1>
        </div>
        
        <!-- API Key -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">OpenRouter API Key</label>
            <input type="password" id="apiKey" class="w-full p-2 rounded border border-gray-700 text-gray-100" placeholder="sk-or-...">
        </div>

        <!-- Model Selection -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Model</label>
            <input type="text"  id="model" class="w-full p-2 rounded border border-gray-700 text-gray-100" value="nvidia/nemotron-3-nano-30b-a3b:free" placeholder="e.g., anthropic/claude-sonnet-4">
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- Left Column -->
            <div class="space-y-4">
                <!-- System Prompt -->
                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt</label>
                    <textarea id="systemPrompt" rows="6" disbaled class="w-full p-2 rounded border border-gray-700 text-gray-100 font-mono text-sm">
You are an ATS‑optimized resume writer. Your ONLY task is to transform the supplied **{resume}** using the exact **{JD}** provided.

### Instructions
1. **Extract keywords** – list every exact phrase from the JD that appears ≥ 2 times.  
2. **Match responsibilities** – for each bullet in the original resume, rewrite it as an **XYZ statement** (implicitly):  
   `Accomplished $X$ as measured by $Y$, by doing $Z`.  
   Replace `$X$`, `$Y$`, `$Z$` with the appropriate content from the matched JD keyword.  
3. **Quantify achievements** – keep only those bullets that contain a metric (%, $#, years, etc.).  
4. **Professional Summary** – a 3‑5 line paragraph **immediately after `= Professional Summary`**. Highlight the **top 3‑5 keyword matches** in **bold** (`*...*`).  
5. **Bullet format** – ensure the whole document is a **single‑page bullet list** (max 10 bullets).  
6. **Structure for F‑pattern** – place the most important information (summary + top bullet points) in the first two paragraphs; HR will scan here first.  
7. **Escape links** – any email address must be written as `email\\@domain.com`. URLs are output as plain text (e.g., `mailto:email@domain.com`).  
8. **Typst code** – output **only a Typst code block** with:  
   - `*` for bold (never `**`).  
   - `=` for H1 headings, `==` for H2 headings.  
   - `#set …` directives **must appear at the very top** of the block, before any heading.  
   - No overlapping text; ensure headings (`==`) and bullet points are clearly separated.  
9. **One‑page limit** – if the content exceeds the space of one printed page, merge the least‑relevant bullets.  
10. **No soft‑skills** – remove any generic adjectives unless they are directly tied to a quantified result.  
11. **No citations** – omit any references to sources, URLs, or external documents.  
12. **Validation step** – before outputting, double‑check that all placeholders `{resume}` and `{JD}` have been removed and replaced with actual content; no `{…}` tokens may remain.

### Output format
```typst
#set text(font: "Linux Libertine", size: 11pt)
#set page(margin: (x: 1cm, y: 1cm))

= Professional Summary
*Key Match 1*, *Key Match 2*...

== Experience
- *Role Title* at *Company*
- Achieved X by doing Y...</textarea>
                </div>

                <!-- User Prompt / Resume -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium">Your Resume (Markdown)</label>
                        <div class="flex items-center gap-2">
                            <span id="resumeStatus" class="text-xs px-2 py-0.5 rounded bg-gray-600">Not Saved</span>
                            <button id="editResumeBtn" class="text-xs bg-yellow-600 hover:bg-yellow-700 px-2 py-1 rounded hidden">Edit</button>
                            <button id="saveResumeBtn" class="text-xs bg-green-600 hover:bg-green-700 px-2 py-1 rounded">Save Resume</button>
                        </div>
                    </div>
                    
                    <!-- PDF Upload -->
                    <div id="pdfUploadSection" class="mb-2 p-3 border border-dashed border-gray-600 rounded">
                        <label class="block text-xs text-gray-400 mb-1">Optional: Upload PDF to convert to Markdown (uses AI if API key provided)</label>
                        <div class="flex items-center gap-2">
                            <input type="file" id="pdfUpload" accept=".pdf" class="text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-gray-700 file:text-gray-300 hover:file:bg-gray-600">
                            <span id="pdfUploadStatus" class="text-xs text-gray-500"></span>
                        </div>
                    </div>
                    
                    <textarea id="userPrompt" rows="8" class="w-full p-2 rounded border border-gray-700 text-gray-100 font-mono text-sm" placeholder="Paste your resume in markdown format, or upload a PDF above to extract text..."></textarea>
                </div>

                <!-- Job Description -->
                <div>
                    <label class="block text-sm font-medium mb-1">Job Description</label>
                    <textarea id="jobDescription" rows="6" class="w-full p-2 rounded border border-gray-700 text-gray-100 font-mono text-sm" placeholder="Paste the job description here..."></textarea>
                </div>

                <!-- Filename -->
                <div>
                    <label class="block text-sm font-medium mb-1">Filename</label>
                    <input type="text" id="filename" class="w-full p-2 rounded border border-gray-700 text-gray-100" placeholder="e.g., google-swe-resume">
                </div>

                <!-- Generate Button -->
                <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded">
                    Generate Resume
                </button>

                <!-- Status -->
                <div id="status" class="text-sm text-gray-400 hidden"></div>
            </div>

            <!-- Right Column -->
            <div class="space-y-4">
                <!-- Typst Code Output -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium">Typst Code</label>
                        <div class="space-x-2">
                            <button id="copyBtn" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">Copy</button>
                            <button id="downloadTypstBtn" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">Download .typ</button>
                            <button id="compileBtn" class="text-xs bg-green-700 hover:bg-green-600 px-2 py-1 rounded">Compile PDF</button>
                        </div>
                    </div>
                    <textarea id="typstCode" rows="12" class="w-full p-2 rounded border border-gray-700 text-gray-100 font-mono text-sm" placeholder="Generated Typst code will appear here..."></textarea>
                </div>

                <!-- PDF Preview -->
                <div>
                    <label class="block text-sm font-medium mb-1">PDF Preview</label>
                    <div id="pdfPreview" class="preview-container rounded border border-gray-700 h-96 flex items-center justify-center">
                        <span class="text-gray-500">PDF preview will appear here after compilation</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Saved Files Section -->
        <div class="mt-8">
            <h2 class="text-lg font-bold mb-3">Saved Resumes</h2>
            <div id="savedFiles" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Saved files will be listed here -->
            </div>
        </div>
    </div>

<script type="module">
        // Import typst-ts for PDF generation
        import { $typst } from 'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-all-in-one.ts@0.7.0-rc2/dist/esm/index.js';

        let typstInitialized = false;

        async function initTypst() {
            if (typstInitialized) return;
            try {
                // FIXED: Point to the actual .wasm files, not the JS modules
                await $typst.setCompilerInitOptions({
                    getModule: () => 'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-web-compiler@0.7.0-rc2/pkg/typst_ts_web_compiler_bg.wasm'
                });
                
                // FIXED: Point to the actual .wasm files, not the JS modules
                await $typst.setRendererInitOptions({
                    getModule: () => 'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-renderer@0.7.0-rc2/pkg/typst_ts_renderer_bg.wasm'
                });
                
                typstInitialized = true;
                console.log("Typst initialized successfully");
            } catch (e) {
                console.error('Typst init error:', e);
                throw e;
            }
        }

        window.$typst = $typst;
        window.initTypst = initTypst;
    </script>

    <script>
        // Initialize PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const STORAGE_KEY = 'job_tracker_files';
        const RESUME_STORAGE_KEY = 'job_tracker_resume';
        const NAME_STORAGE_KEY = 'job_tracker_name';

        // Name Modal Elements
        const nameModal = document.getElementById('nameModal');
        const nameInput = document.getElementById('nameInput');
        const saveNameBtn = document.getElementById('saveNameBtn');
        const stdnameDisplay = document.getElementById('stdname');
        const nameTagContainer = document.getElementById('nameTagContainer');

        // Check if name exists and handle modal visibility
        function checkName() {
            const savedName = localStorage.getItem(NAME_STORAGE_KEY);
            if (savedName && savedName.trim() !== '') {
                stdnameDisplay.textContent = savedName;
                nameModal.style.display = 'none';
                nameModal.classList.add('hidden');
            } else {
                nameModal.style.display = 'flex';
                nameModal.classList.remove('hidden');
                nameInput.focus();
            }
        }

        // Save name
        saveNameBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (!name) {
                nameInput.style.borderColor = '#ef4444';
                return;
            }
            localStorage.setItem(NAME_STORAGE_KEY, name);
            stdnameDisplay.textContent = name;
            nameModal.style.display = 'none';
            nameModal.classList.add('hidden');
        });

        // Allow pressing Enter to save name
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveNameBtn.click();
            }
        });

        // Click name tag to change name
        nameTagContainer.addEventListener('click', () => {
            const currentName = localStorage.getItem(NAME_STORAGE_KEY) || '';
            nameInput.value = currentName;
            nameModal.style.display = 'flex';
            nameModal.classList.remove('hidden');
            nameInput.focus();
        });

        // Initialize name check
        checkName();

        // DOM Elements
        const apiKeyInput = document.getElementById('apiKey');
        const modelInput = document.getElementById('model');
        const systemPromptInput = document.getElementById('systemPrompt');
        const userPromptInput = document.getElementById('userPrompt');
        const jobDescriptionInput = document.getElementById('jobDescription');
        const filenameInput = document.getElementById('filename');
        const generateBtn = document.getElementById('generateBtn');
        const typstCodeInput = document.getElementById('typstCode');
        const copyBtn = document.getElementById('copyBtn');
        const downloadTypstBtn = document.getElementById('downloadTypstBtn');
        const compileBtn = document.getElementById('compileBtn');
        const pdfPreview = document.getElementById('pdfPreview');
        const savedFilesDiv = document.getElementById('savedFiles');
        const statusDiv = document.getElementById('status');
        
        // Resume related elements
        const pdfUpload = document.getElementById('pdfUpload');
        const pdfUploadStatus = document.getElementById('pdfUploadStatus');
        const pdfUploadSection = document.getElementById('pdfUploadSection');
        const resumeStatus = document.getElementById('resumeStatus');
        const editResumeBtn = document.getElementById('editResumeBtn');
        const saveResumeBtn = document.getElementById('saveResumeBtn');

        let resumeLocked = false;

        // Load saved API key
        apiKeyInput.value = localStorage.getItem('openrouter_api_key') || '';
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('openrouter_api_key', apiKeyInput.value);
        });

        // Load saved resume
        function loadSavedResume() {
            const savedResume = localStorage.getItem(RESUME_STORAGE_KEY);
            if (savedResume) {
                userPromptInput.value = savedResume;
                lockResume();
            }
        }

        // Lock resume (make non-editable)
        function lockResume() {
            resumeLocked = true;
            userPromptInput.disabled = true;
            pdfUploadSection.classList.add('hidden');
            resumeStatus.textContent = 'Saved';
            resumeStatus.className = 'text-xs px-2 py-0.5 rounded locked-indicator text-white';
            editResumeBtn.classList.remove('hidden');
            saveResumeBtn.classList.add('hidden');
        }

        // Unlock resume (make editable)
        function unlockResume() {
            resumeLocked = false;
            userPromptInput.disabled = false;
            pdfUploadSection.classList.remove('hidden');
            resumeStatus.textContent = 'Editing';
            resumeStatus.className = 'text-xs px-2 py-0.5 rounded bg-yellow-600 text-white';
            editResumeBtn.classList.add('hidden');
            saveResumeBtn.classList.remove('hidden');
        }

        // Save resume
        saveResumeBtn.addEventListener('click', () => {
            const resume = userPromptInput.value.trim();
            if (!resume) {
                showStatus('Please enter your resume before saving', true);
                return;
            }
            localStorage.setItem(RESUME_STORAGE_KEY, resume);
            lockResume();
            showStatus('Resume saved successfully!');
        });

        // Edit resume
        editResumeBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to edit your saved resume?')) {
                unlockResume();
            }
        });

        // Convert extracted text to basic markdown (fallback/local method)
        function convertToMarkdownLocal(text) {
            // Clean up extra whitespace
            let md = text.replace(/\s+/g, ' ').trim();
            
            // Try to detect and format sections (common resume headers)
            const headers = ['experience', 'education', 'skills', 'projects', 'summary', 'objective', 'work history', 'employment', 'certifications', 'awards', 'languages', 'interests', 'references', 'contact'];
            
            headers.forEach(header => {
                const regex = new RegExp(`(${header})`, 'gi');
                md = md.replace(regex, '\n\n## $1\n\n');
            });

            // Clean up multiple newlines
            md = md.replace(/\n{3,}/g, '\n\n');
            
            return md.trim();
        }

        // Convert PDF text to markdown using OpenRouter API
        async function convertToMarkdownWithAI(rawText) {
            const apiKey = apiKeyInput.value.trim();
            
            if (!apiKey) {
                throw new Error('Please enter your OpenRouter API key first');
            }

            const systemPrompt = `
You are a document converter. Your ONLY task is to convert the given raw text extracted from a PDF resume into clean, well-formatted Markdown **and extract any hyperlinks that appear in the text**.

STRICT RULES:
1. Output ONLY the markdown content - no explanations, no comments, no additional text.  
2. Do NOT add any new information beyond what is present in the original text.  
3. Do NOT remove any information.  
4. Do NOT modify, rephrase, or enhance any content.  
5. Preserve ALL original text exactly as provided, including the URLs/links.  
6. Extract URLs/links and represent them using Markdown syntax '[link text](url)'.  
7. Structure the extracted content with proper markdown formatting:  
   - Use '#' for main headings (name, main sections)  
   - Use '##' for subsections  
   - Use **bold** for job titles, company names, degrees  
   - Use bullet points ('-') for list items  
   - Use proper line breaks between sections  
8. Fix any obvious formatting issues from PDF extraction (broken words, missing spaces).  
9. Maintain the original order of all content, ensuring that extracted links appear in the same relative position as in the source text.  
`;

            const userPrompt = `Convert this raw PDF text to clean markdown. Keep ALL content exactly the same, just format it properly:
${rawText}`;

            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': window.location.href,
                    'X-Title': 'Resume PDF Converter'
                },
                body: JSON.stringify({
                    model: modelInput.value.trim(),
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: userPrompt }
                    ]
                })
            });

            const data = await response.json();

            if (data.error) {
                // Check for rate limiting
                if (response.status === 429 || data.error.code === 429 || (data.error.message && data.error.message.toLowerCase().includes('rate'))) {
                    throw new Error('RATE_LIMITED');
                }
                throw new Error(data.error.message || 'API Error');
            }

            let markdown = data.choices[0].message.content;
            
            // Clean up any code block wrappers if the AI added them
            markdown = markdown.replace(/^```markdown?\n?/gm, '').replace(/\n?```$/gm, '').trim();
            
            return markdown;
        }

        // PDF Upload and Conversion
        pdfUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf') {
                pdfUploadStatus.textContent = 'Please select a PDF file';
                pdfUploadStatus.className = 'text-xs text-red-400';
                return;
            }

            pdfUploadStatus.textContent = 'Extracting text from PDF...';
            pdfUploadStatus.className = 'text-xs text-yellow-400';

            try {
                // First, extract raw text from PDF using PDF.js
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                let fullText = '';
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += pageText + '\n\n';
                }

                const apiKey = apiKeyInput.value.trim();
                
                // If no API key, use local conversion
                if (!apiKey) {
                    pdfUploadStatus.textContent = 'Using local conversion (no API key)...';
                    pdfUploadStatus.className = 'text-xs text-yellow-400';
                    
                    const markdown = convertToMarkdownLocal(fullText);
                    userPromptInput.value = markdown;
                    
                    pdfUploadStatus.textContent = `Converted ${pdf.numPages} page(s) locally. Add API key for better formatting.`;
                    pdfUploadStatus.className = 'text-xs text-green-400';
                    return;
                }

                pdfUploadStatus.textContent = 'Converting to markdown with AI...';
                pdfUploadStatus.className = 'text-xs text-blue-400';

                try {
                    // Send to OpenRouter API for markdown conversion
                    const markdown = await convertToMarkdownWithAI(fullText);
                    userPromptInput.value = markdown;
                    
                    pdfUploadStatus.textContent = `Converted ${pdf.numPages} page(s) successfully!`;
                    pdfUploadStatus.className = 'text-xs text-green-400';
                } catch (apiError) {
                    // If rate limited, fall back to local conversion
                    if (apiError.message === 'RATE_LIMITED') {
                        pdfUploadStatus.textContent = 'Rate limited - using local conversion...';
                        pdfUploadStatus.className = 'text-xs text-yellow-400';
                        
                        const markdown = convertToMarkdownLocal(fullText);
                        userPromptInput.value = markdown;
                        
                        pdfUploadStatus.textContent = `Converted ${pdf.numPages} page(s) locally (API rate limited). Try again later for AI formatting.`;
                        pdfUploadStatus.className = 'text-xs text-orange-400';
                    } else {
                        throw apiError;
                    }
                }
                
            } catch (error) {
                console.error('PDF conversion error:', error);
                pdfUploadStatus.textContent = `Error: ${error.message}`;
                pdfUploadStatus.className = 'text-xs text-red-400';
            }
        });

        // Initialize resume state on load
        loadSavedResume();

        // Show status
        function showStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.className = `text-sm ${isError ? 'text-red-400' : 'text-gray-400'}`;
            statusDiv.classList.remove('hidden');
        }

        // Generate resume via OpenRouter
        generateBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const model = modelInput.value.trim();
            const systemPrompt = systemPromptInput.value.trim();
            const userPrompt = userPromptInput.value.trim();
            const jobDescription = jobDescriptionInput.value.trim();
            const filename = filenameInput.value.trim();

            if (!apiKey) {
                showStatus('Please enter your OpenRouter API key', true);
                return;
            }

            if (!filename) {
                showStatus('Please enter a filename', true);
                return;
            }

            const fullUserPrompt = `USER INFO/INSTRUCTIONS:
${userPrompt}

JOB DESCRIPTION:
${jobDescription}`;

            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
            showStatus('Sending request to OpenRouter...');

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Job Tracker'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: fullUserPrompt }
                        ]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || 'API Error');
                }

                let typstCode = data.choices[0].message.content;
                
                // Clean up the response - remove markdown code blocks if present
                typstCode = typstCode.replace(/^```typst?\n?/gm, '').replace(/\n?```$/gm, '').trim();
                
                typstCodeInput.value = typstCode;

                // Save to localStorage
                saveFile(filename, typstCode, jobDescription);
                
                showStatus('Generated successfully! Click "Compile PDF" to preview.');
                loadSavedFiles();

            } catch (error) {
                showStatus(`Error: ${error.message}`, true);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Resume';
            }
        });

        // Copy Typst code
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(typstCodeInput.value);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = 'Copy', 1500);
        });

        // Download Typst file
        downloadTypstBtn.addEventListener('click', () => {
            const filename = filenameInput.value.trim() || 'resume';
            const blob = new Blob([typstCodeInput.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.typ`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Compile to PDF
        compileBtn.addEventListener('click', async () => {
            const typstCode = typstCodeInput.value.trim();
            if (!typstCode) {
                showStatus('No Typst code to compile', true);
                return;
            }

            compileBtn.disabled = true;
            compileBtn.textContent = 'Compiling...';
            showStatus('Initializing Typst compiler...');

            try {
                await window.initTypst();
                showStatus('Compiling Typst to PDF...');

                const pdf = await window.$typst.pdf({ mainContent: typstCode });
                
                const blob = new Blob([pdf], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                pdfPreview.innerHTML = `
                    <iframe src="${url}" class="w-full h-full rounded" style="min-height: 400px;"></iframe>
                `;

                // Add download button
                const downloadPdfBtn = document.createElement('button');
                downloadPdfBtn.textContent = 'Download PDF';
                downloadPdfBtn.className = 'absolute top-2 right-2 text-xs bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded';
                downloadPdfBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${filenameInput.value.trim() || 'resume'}.pdf`;
                    a.click();
                };
                pdfPreview.style.position = 'relative';
                pdfPreview.appendChild(downloadPdfBtn);

                showStatus('PDF compiled successfully!');

            } catch (error) {
                console.error('Compile error:', error);
                showStatus(`Compilation error: ${error.message}`, true);
                pdfPreview.innerHTML = `<div class="p-4 text-red-400 text-sm">
                    <p class="font-bold">Compilation Error:</p>
                    <pre class="mt-2 whitespace-pre-wrap">${error.message}</pre>
                </div>`;
            } finally {
                compileBtn.disabled = false;
                compileBtn.textContent = 'Compile PDF';
            }
        });

        // Save file to localStorage
        function saveFile(filename, typstCode, jobDescription) {
            const files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            files[filename] = {
                typstCode,
                jobDescription,
                createdAt: new Date().toISOString()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
        }

        // Load saved files
        function loadSavedFiles() {
            const files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const entries = Object.entries(files);

            if (entries.length === 0) {
                savedFilesDiv.innerHTML = '<p class="text-gray-500 col-span-full">No saved resumes yet.</p>';
                return;
            }

            savedFilesDiv.innerHTML = entries.map(([name, data]) => `
                <div class="bg-gray-800 p-3 rounded border border-gray-700">
                    <div class="font-medium mb-1">${name}</div>
                    <div class="text-xs text-gray-400 mb-2">${new Date(data.createdAt).toLocaleDateString()}</div>
                    <div class="flex gap-2">
                        <button onclick="loadFile('${name}')" class="text-xs bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded">Load</button>
                        <button onclick="deleteFile('${name}')" class="text-xs bg-red-600 hover:bg-red-700 px-2 py-1 rounded">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Load file
        window.loadFile = function(filename) {
            const files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const file = files[filename];
            if (file) {
                filenameInput.value = filename;
                typstCodeInput.value = file.typstCode;
                jobDescriptionInput.value = file.jobDescription || '';
                showStatus(`Loaded "${filename}"`);
            }
        };

        // Delete file
        window.deleteFile = function(filename) {
            if (confirm(`Delete "${filename}"?`)) {
                const files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                delete files[filename];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
                loadSavedFiles();
                showStatus(`Deleted "${filename}"`);
            }
        };

        // Initial load
        loadSavedFiles();
    </script>
</body>
</html>
