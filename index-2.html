You are an ATS-optimized resume writer. Your task is to transform the supplied **{resume}** using the exact **{JD}** provided.

### 1. ATS Content Strategy
1. **Extract keywords**: Identify phrases from the JD that appear ≥ 2 times.
2. **Rewrite bullets**: Transform every experience bullet into this structure: 
   `Accomplished $X$ (metric), as measured by $Y$, by doing $Z$ (keyword).`
3. **Quantify**: Only keep bullets that include numbers (%, $, #).
4. **Summary**: Write a 3-line summary immediately after `= Professional Summary`. Bold the **top 3 matching hard skills**.
5. **No Soft Skills**: Remove words like "passionate," "leader," or "hard-working" unless tied to a number.

### 2. Strict Typst Syntax Rules (CRITICAL)
1. **Headings**: Use `=` for main sections (e.g., `= Experience`) and `==` for subsections. NEVER use `#` for headings.
2. **Bold**: Use single asterisks `*bold*`. NEVER use double `**`.
3. **Links**: Use syntax `#link("url")[text]`.
4. **Escaping**: You MUST escape the `@` symbol in emails like this: `name\@domain.com`.
5. **Alignment**: Use `#h(1fr)` to push dates/locations to the right side of the line.
6. **Placeholders**: Replace ALL placeholders ({resume}, {JD}) with actual content.

### 3. Output Requirements
- **Format**: Output ONLY raw Typst code. No markdown fences (```typst).
- **Length**: Maximum 1 page.
- **Bullets**: Maximum 12 total bullet points across the entire document.

### 4. Required Output Template
Use this exact structure. Do not deviate.

#set text(font: "Linux Libertine", size: 11pt)
#set page(margin: (x: 1.25cm, y: 1.25cm))
#set par(justify: true)

#align(center)[
  #text(16pt, weight: "bold")[Your Full Name] \

  #link("[https://linkedin.com/in/username](https://linkedin.com/in/username)")[LinkedIn] | #link("[https://github.com/username](https://github.com/username)")[GitHub]
]

    <script type="module">
        // Import typst-ts for PDF generation
        import { $typst } from '[https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-all-in-one.ts@0.7.0-rc2/dist/esm/index.js](https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-all-in-one.ts@0.7.0-rc2/dist/esm/index.js)';

        let typstInitialized = false;

        async function initTypst() {
            if (typstInitialized) return;
            try {
                // Point to the actual .wasm files, not the JS modules
                await $typst.setCompilerInitOptions({
                    getModule: () => '[https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-web-compiler@0.7.0-rc2/pkg/typst_ts_web_compiler_bg.wasm](https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-web-compiler@0.7.0-rc2/pkg/typst_ts_web_compiler_bg.wasm)'
                });
                
                // Point to the actual .wasm files, not the JS modules
                await $typst.setRendererInitOptions({
                    getModule: () => '[https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-renderer@0.7.0-rc2/pkg/typst_ts_renderer_bg.wasm](https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-renderer@0.7.0-rc2/pkg/typst_ts_renderer_bg.wasm)'
                });
                
                typstInitialized = true;
                console.log("Typst initialized successfully");
            } catch (e) {
                console.error('Typst init error:', e);
                throw e;
            }
        }

        window.$typst = $typst;
        window.initTypst = initTypst;
    </script>

    <script>
        // Initialize PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = '[https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js](https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js)';

        const STORAGE_KEY = 'job_tracker_files';
        const RESUME_STORAGE_KEY = 'job_tracker_resume';
        const NAME_STORAGE_KEY = 'job_tracker_name';
        const API_KEY_STORAGE = 'gemini_api_key'; // Changed storage key

        // Name Modal Elements
        const nameModal = document.getElementById('nameModal');
        const nameInput = document.getElementById('nameInput');
        const saveNameBtn = document.getElementById('saveNameBtn');
        const stdnameDisplay = document.getElementById('stdname');
        const nameTagContainer = document.getElementById('nameTagContainer');

        // Check if name exists and handle modal visibility
        function checkName() {
            const savedName = localStorage.getItem(NAME_STORAGE_KEY);
            if (savedName && savedName.trim() !== '') {
                stdnameDisplay.textContent = savedName;
                nameModal.style.display = 'none';
                nameModal.classList.add('hidden');
            } else {
                nameModal.style.display = 'flex';
                nameModal.classList.remove('hidden');
                nameInput.focus();
            }
        }

        // Save name
        saveNameBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (!name) {
                nameInput.style.borderColor = '#ef4444';
                return;
            }
            localStorage.setItem(NAME_STORAGE_KEY, name);
            stdnameDisplay.textContent = name;
            nameModal.style.display = 'none';
            nameModal.classList.add('hidden');
        });

        // Allow pressing Enter to save name
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveNameBtn.click();
            }
        });

        // Click name tag to change name
        nameTagContainer.addEventListener('click', () => {
            const currentName = localStorage.getItem(NAME_STORAGE_KEY) || '';
            nameInput.value = currentName;
            nameModal.style.display = 'flex';
            nameModal.classList.remove('hidden');
            nameInput.focus();
        });

        // Initialize name check
        checkName();

        // DOM Elements
        const apiKeyInput = document.getElementById('apiKey');
        const modelInput = document.getElementById('model');
        const systemPromptInput = document.getElementById('systemPrompt');
        const userPromptInput = document.getElementById('userPrompt');
        const jobDescriptionInput = document.getElementById('jobDescription');
        const filenameInput = document.getElementById('filename');
        const generateBtn = document.getElementById('generateBtn');
        const typstCodeInput = document.getElementById('typstCode');
        const copyBtn = document.getElementById('copyBtn');
        const downloadTypstBtn = document.getElementById('downloadTypstBtn');
        const compileBtn = document.getElementById('compileBtn');
        const pdfPreview = document.getElementById('pdfPreview');
        const savedFilesDiv = document.getElementById('savedFiles');
        const statusDiv = document.getElementById('status');
        
        // Resume related elements
        const pdfUpload = document.getElementById('pdfUpload');
        const pdfUploadStatus = document.getElementById('pdfUploadStatus');
        const pdfUploadSection = document.getElementById('pdfUploadSection');
        const resumeStatus = document.getElementById('resumeStatus');
        const editResumeBtn = document.getElementById('editResumeBtn');
        const saveResumeBtn = document.getElementById('saveResumeBtn');

        let resumeLocked = false;

        // Load saved API key
        apiKeyInput.value = localStorage.getItem(API_KEY_STORAGE) || '';
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem(API_KEY_STORAGE, apiKeyInput.value);
        });

        // Load saved resume
        function loadSavedResume() {
            const savedResume = localStorage.getItem(RESUME_STORAGE_KEY);
            if (savedResume) {
                userPromptInput.value = savedResume;
                lockResume();
            }
        }

        // Lock resume (make non-editable)
        function lockResume() {
            resumeLocked = true;
            userPromptInput.disabled = true;
            pdfUploadSection.classList.add('hidden');
            resumeStatus.textContent = 'Saved';
            resumeStatus.className = 'text-xs px-2 py-0.5 rounded locked-indicator text-white';
            editResumeBtn.classList.remove('hidden');
            saveResumeBtn.classList.add('hidden');
        }

        // Unlock resume (make editable)
        function unlockResume() {
            resumeLocked = false;
            userPromptInput.disabled = false;
            pdfUploadSection.classList.remove('hidden');
            resumeStatus.textContent = 'Editing';
            resumeStatus.className = 'text-xs px-2 py-0.5 rounded bg-yellow-600 text-white';
            editResumeBtn.classList.add('hidden');
            saveResumeBtn.classList.remove('hidden');
        }

        // Save resume
        saveResumeBtn.addEventListener('click', () => {
            const resume = userPromptInput.value.trim();
            if (!resume) {
                showStatus('Please enter your resume before saving', true);
                return;
            }
            localStorage.setItem(RESUME_STORAGE_KEY, resume);
            lockResume();
            showStatus('Resume saved successfully!');
        });

        // Edit resume
        editResumeBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to edit your saved resume?')) {
                unlockResume();
            }
        });

        // Convert extracted text to basic markdown (fallback/local method)
        function convertToMarkdownLocal(text) {
            let md = text.replace(/\s+/g, ' ').trim();
            const headers = ['experience', 'education', 'skills', 'projects', 'summary', 'objective', 'work history', 'employment', 'certifications', 'awards', 'languages', 'interests', 'references', 'contact'];
            headers.forEach(header => {
                const regex = new RegExp(`(${header})`, 'gi');
                md = md.replace(regex, '\n\n## $1\n\n');
            });
            md = md.replace(/\n{3,}/g, '\n\n');
            return md.trim();
        }

        // --- GEMINI API HELPERS ---
        
        async function callGemini(apiKey, model, systemPrompt, userMessage) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            
            const payload = {
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                contents: [
                    {
                        role: "user",
                        parts: [{ text: userMessage }]
                    }
                ],
                generationConfig: {
                    temperature: 0.7,
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `Gemini API Error: ${response.status}`);
            }

            if (!data.candidates || data.candidates.length === 0) {
                 // Check if blocked due to safety settings
                 if (data.promptFeedback && data.promptFeedback.blockReason) {
                    throw new Error(`Blocked by safety settings: ${data.promptFeedback.blockReason}`);
                 }
                 throw new Error("No response generated");
            }

            return data.candidates[0].content.parts[0].text;
        }

        // Convert PDF text to markdown using Gemini
        async function convertToMarkdownWithAI(rawText) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) throw new Error('Please enter your Gemini API key first');

            const systemPrompt = `
You are a document converter. Your ONLY task is to convert the given raw text extracted from a PDF resume into clean, well-formatted Markdown.

STRICT RULES:
1. Output ONLY the markdown content.
2. Do NOT add new info or remove existing info.
3. Preserve all URLs.
4. Use standard markdown structure (#, ##, -, **).
`;
            const userPrompt = `Convert this raw text to clean markdown:\n${rawText}`;
            
            // Call Gemini
            let markdown = await callGemini(apiKey, modelInput.value.trim(), systemPrompt, userPrompt);
            
            // Cleanup code blocks
            markdown = markdown.replace(/^```markdown?\n?/gm, '').replace(/\n?```$/gm, '').trim();
            return markdown;
        }

        // PDF Upload and Conversion
        pdfUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf') {
                pdfUploadStatus.textContent = 'Please select a PDF file';
                pdfUploadStatus.className = 'text-xs text-red-400';
                return;
            }

            pdfUploadStatus.textContent = 'Extracting text from PDF...';
            pdfUploadStatus.className = 'text-xs text-yellow-400';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = '';
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += pageText + '\n\n';
                }

                const apiKey = apiKeyInput.value.trim();
                
                if (!apiKey) {
                    pdfUploadStatus.textContent = 'Using local conversion (no API key)...';
                    pdfUploadStatus.className = 'text-xs text-yellow-400';
                    const markdown = convertToMarkdownLocal(fullText);
                    userPromptInput.value = markdown;
                    pdfUploadStatus.textContent = `Converted ${pdf.numPages} page(s) locally.`;
                    pdfUploadStatus.className = 'text-xs text-green-400';
                    return;
                }

                pdfUploadStatus.textContent = 'Converting with Gemini...';
                pdfUploadStatus.className = 'text-xs text-blue-400';

                try {
                    const markdown = await convertToMarkdownWithAI(fullText);
                    userPromptInput.value = markdown;
                    pdfUploadStatus.textContent = `Converted ${pdf.numPages} page(s) successfully!`;
                    pdfUploadStatus.className = 'text-xs text-green-400';
                } catch (apiError) {
                    // Check for 429 (Rate Limit) specifically if exposed in message
                    if (apiError.message.includes('429')) {
                        pdfUploadStatus.textContent = 'Rate limited - using local conversion...';
                        pdfUploadStatus.className = 'text-xs text-yellow-400';
                        const markdown = convertToMarkdownLocal(fullText);
                        userPromptInput.value = markdown;
                        pdfUploadStatus.textContent = `Converted locally (API busy).`;
                        pdfUploadStatus.className = 'text-xs text-orange-400';
                    } else {
                        throw apiError;
                    }
                }
                
            } catch (error) {
                console.error('PDF conversion error:', error);
                pdfUploadStatus.textContent = `Error: ${error.message}`;
                pdfUploadStatus.className = 'text-xs text-red-400';
            }
        });

        // Initialize resume state on load
        loadSavedResume();

        function showStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.className = `text-sm ${isError ? 'text-red-400' : 'text-gray-400'}`;
            statusDiv.classList.remove('hidden');
        }

        // Generate resume via Gemini
        generateBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const model = modelInput.value.trim();
            const systemPrompt = systemPromptInput.value.trim();
            const userPrompt = userPromptInput.value.trim();
            const jobDescription = jobDescriptionInput.value.trim();
            const filename = filenameInput.value.trim();

            if (!apiKey) {
                showStatus('Please enter your Gemini API key', true);
                return;
            }

            if (!filename) {
                showStatus('Please enter a filename', true);
                return;
            }

            const fullUserPrompt = `RESUME CONTENT:
${userPrompt}

TARGET JOB DESCRIPTION:
${jobDescription}`;

            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
            showStatus('Sending request to Gemini...');

            try {
                let typstCode = await callGemini(apiKey, model, systemPrompt, fullUserPrompt);
                
                // Clean up markdown blocks
                typstCode = typstCode.replace(/^```typst?\n?/gm, '').replace(/\n?```$/gm, '').trim();
                
                typstCodeInput.value = typstCode;
                saveFile(filename, typstCode, jobDescription);
                showStatus('Generated successfully! Click "Compile PDF" to preview.');
                loadSavedFiles();

            } catch (error) {
                showStatus(`Error: ${error.message}`, true);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Resume';

            navigator.clipboard.writeText(typstCodeInput.value);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = 'Copy', 1500);
        });

        // Download Typst file
        downloadTypstBtn.addEventListener('click', () => {
            const filename = filenameInput.value.trim() || 'resume';
            const blob = new Blob([typstCodeInput.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.typ`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Compile to PDF
        compileBtn.addEventListener('click', async () => {
            const typstCode = typstCodeInput.value.trim();
            if (!typstCode) {
                showStatus('No Typst code to compile', true);
                return;
            }

            compileBtn.disabled = true;
            compileBtn.textContent = 'Compiling...';
            showStatus('Initializing Typst compiler...');

            try {
                await window.initTypst();
                showStatus('Compiling Typst to PDF...');

                const pdf = await window.$typst.pdf({ mainContent: typstCode });
                
                const blob = new Blob([pdf], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                pdfPreview.innerHTML = `
                    <iframe src="${url}" class="w-full h-full rounded" style="min-height: 400px;"></iframe>
                `;

                const downloadPdfBtn = document.createElement('button');
                downloadPdfBtn.textContent = 'Download PDF';
                downloadPdfBtn.className = 'absolute top-2 right-2 text-xs bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded';
                downloadPdfBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${filenameInput.value.trim() || 'resume'}.pdf`;
                    a.click();
                };
                pdfPreview.style.position = 'relative';
                pdfPreview.appendChild(downloadPdfBtn);

                showStatus('PDF compiled successfully!');

            } catch (error) {
                console.error('Compile error:', error);
                showStatus(`Compilation error: ${error.message}`, true);
                pdfPreview.innerHTML = `<div class="p-4 text-red-400 text-sm">
                    <p class="font-bold">Compilation Error:</p>
                    <pre class="mt-2 whitespace-pre-wrap">${error.message}</pre>
                </div>`;
            } finally {
                compileBtn.disabled = false;
                compileBtn.textContent = 'Compile PDF';
            }
        });

        // Save file to localStorage
        function saveFile(filename, typstCode, jobDescription) {
            const files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            files[filename] = {
                typstCode,
                jobDescription,
                createdAt: new Date().toISOString()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
        }

        // Load saved files
        function loadSavedFiles() {
            const files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const entries = Object.entries(files);

            if (entries.length === 0) {
                savedFilesDiv.innerHTML = '<p class="text-gray-500 col-span-full">No saved resumes yet.</p>';
                return;
            }

            savedFilesDiv.innerHTML = entries.map(([name, data]) => `
                <div class="bg-gray-800 p-3 rounded border border-gray-700">
                    <div class="font-medium mb-1">${name}</div>
                    <div class="text-xs text-gray-400 mb-2">${new Date(data.createdAt).toLocaleDateString()}</div>
                    <div class="flex gap-2">
                        <button onclick="loadFile('${name}')" class="text-xs bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded">Load</button>
                        <button onclick="deleteFile('${name}')" class="text-xs bg-red-600 hover:bg-red-700 px-2 py-1 rounded">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        window.loadFile = function(filename) {
            const files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const file = files[filename];
            if (file) {
                filenameInput.value = filename;
                typstCodeInput.value = file.typstCode;
                jobDescriptionInput.value = file.jobDescription || '';
                showStatus(`Loaded "${filename}"`);
            }
        };

        window.deleteFile = function(filename) {
            if (confirm(`Delete "${filename}"?`)) {
                const files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                delete files[filename];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
                loadSavedFiles();
                showStatus(`Deleted "${filename}"`);
            }
        };

        loadSavedFiles();
    </script>
</body>
</html>
